name: Contractor Front Office Agent

on:
  push:
    branches: [main]
    paths: ["Contractor-Front-Office-Agent/**", ".github/workflows/contractor-agent.yml"]
  pull_request:
    paths: ["Contractor-Front-Office-Agent/**", ".github/workflows/contractor-agent.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: Contractor-Front-Office-Agent

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Contractor-Front-Office-Agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Calls the Claude API (~10-20 cents per run). Skipped unless the ANTHROPIC_API_KEY
  # repository secret is set: Settings -> Secrets and variables -> Actions.
  conversation-evals:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: claude-sonnet-4-6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Contractor-Front-Office-Agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check API key format (never prints the key)
        if: env.ANTHROPIC_API_KEY != ''
        shell: python
        run: |
          import os, sys
          k = os.environ["ANTHROPIC_API_KEY"]
          problems = [msg for bad, msg in [
              (k != k.strip(), "has spaces or line breaks around it"),
              (k[:1] in "\"'" or k[-1:] in "\"'", "is wrapped in quotes"),
              ("=" in k, "includes 'ANTHROPIC_API_KEY=' or another '='"),
              (not k.strip().strip("\"'").startswith("sk-ant-"), "does not start with sk-ant-"),
          ] if bad]
          summary = f"key length {len(k)}, type prefix {k.strip().strip(chr(34) + chr(39))[:10]}"
          if problems:
              print(f"::error::ANTHROPIC_API_KEY secret {'; '.join(problems)} ({summary})")
              sys.exit(1)
          print(summary)
      - run: pytest -m eval -v -rs
